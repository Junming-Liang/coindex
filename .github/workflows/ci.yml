name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      CODEX_TODO_CODEX: /usr/bin/true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Version and changelog
        run: |
          python3 scripts/release.py version
          python3 scripts/release.py notes
      - name: Backend regression tests (no real login or model requests)
        run: python3 -m unittest discover -s tests -v
      - name: Swift animation tests
        run: |
          mkdir -p build
          swiftc Sources/PetAnimation.swift tests/pet-animation/main.swift -o build/pet-animation-tests
          build/pet-animation-tests
      - name: Task filtering and sidebar counts
        run: bash scripts/test-task-filtering.sh
      - name: Universal application
        run: COINDEX_ARCHS="arm64 x86_64" bash scripts/build.sh
      - name: Package and verify public macOS application
        run: python3 scripts/release.py package macos
      - name: Source package
        run: python3 scripts/package-source.py
      - name: Retain macOS and source packages
        uses: actions/upload-artifact@v7
        with:
          name: coindex-macos
          path: |
            dist/coindex-*-macos-universal.dmg
            dist/coindex-*-macos-universal.zip
            dist/coindex-*-source.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CODEX_TODO_CODEX: /usr/bin/true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Tk and headless desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb desktop-file-utils fonts-noto-cjk
      - name: Backend and Linux desktop regression tests
        run: xvfb-run -a python3 -m unittest discover -s tests -v
      - name: Build Linux application bundle
        run: bash scripts/build-linux.sh
      - name: Install bundle in isolated user directories
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/coindex-xdg-data"
          bash dist/coindex-linux/scripts/install-linux.sh --prefix "$RUNNER_TEMP/coindex-prefix"
          "$RUNNER_TEMP/coindex-prefix/bin/coindex" --help
          desktop-file-validate "$XDG_DATA_HOME/applications/org.coindex.desktop.desktop"
      - name: Linux desktop smoke test
        run: xvfb-run -a env XDG_DATA_HOME="$RUNNER_TEMP/coindex-xdg-data" "$RUNNER_TEMP/coindex-prefix/bin/coindex" --demo --data-dir "$RUNNER_TEMP/coindex-bundle-smoke" --smoke-test
      - name: Package and verify public Linux application
        run: python3 scripts/release.py package linux
      - name: Retain Linux package
        uses: actions/upload-artifact@v7
        with:
          name: coindex-linux
          path: dist/coindex-*-linux.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  release-check:
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: coindex-*
          path: dist
          merge-multiple: true
      - name: Verify complete release and generate SHA-256 manifest
        run: |
          python3 scripts/release.py checksums
          python3 scripts/release.py verify
      - name: Retain complete release candidate
        uses: actions/upload-artifact@v7
        with:
          name: coindex-release
          path: |
            dist/coindex-*.dmg
            dist/coindex-*.zip
            dist/coindex-*.tar.gz
            dist/coindex-*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
